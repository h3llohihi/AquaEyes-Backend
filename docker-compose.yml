services:
  backend:
    build: .
    container_name: aquaeyes-backend
    ports:
      - "4558:4558"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - aquaeyes-network
    healthcheck:
      test: ["CMD", "sh", "-c", "bun -e \"fetch('http://localhost:' + (process.env.PORT || 4558)).then(() => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
networks:
  aquaeyes-network:
    driver: bridge

